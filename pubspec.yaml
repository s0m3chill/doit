name: doit
description: "DoIt - Universal Reminder App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  provider: ^6.1.2

  # Local storage
  sqflite: ^2.4.2
  path: ^1.9.1

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Functional programming helpers
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.7

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Timezone support
  timezone: ^0.10.0

  # UUID generation
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Code generation
  injectable_generator: ^2.7.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
